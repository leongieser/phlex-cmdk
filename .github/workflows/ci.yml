name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bundle exec rake test
      - run: node --check assets/js/cmdk.js
      - run: bundle exec rake test:js
      # Runtime DOM tests in the runner's preinstalled Google Chrome (via Ferrum).
      - run: bundle exec rake test:browser
